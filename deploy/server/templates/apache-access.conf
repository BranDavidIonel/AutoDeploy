# Who may open AutoDeploy at https://{{DOMAIN}} – included by the Apache site {{SITE_NAME}}.
# deploy/server/install.sh creates this file once and never overwrites it: your changes stay.
# After a change:  apache2ctl configtest && systemctl reload apache2
#
# AutoDeploy can run any command as root on this server. Besides its own login, limit who can
# reach it at all: uncomment ONE of the two blocks below.
#
# The extra "Require" lines keep two things working:
#   - Require local: the installer's health check (GET /up from this server);
#   - Require expr: GitHub push webhooks (POST /webhook/<token>). THE_REQUEST is the original request
#     line, so it still matches after Laravel's .htaccess rewrites the URL to /index.php.
#     Remove that line if you do not use webhooks.

# 1) Only some IP addresses (yours, your VPN). Replace the examples.
#<Location "/">
#    <RequireAny>
#        Require ip 203.0.113.10
#        Require ip 198.51.100.0/24
#        Require local
#        Require expr "%{THE_REQUEST} =~ m#^POST /webhook/[^/ ]+ HTTP/#"
#    </RequireAny>
#</Location>

