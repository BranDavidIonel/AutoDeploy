
<VirtualHost *:443>
    ServerName {{DOMAIN}}
    DocumentRoot "{{APP_DIR}}/public"

    SSLEngine on
    SSLCertificateFile "{{SSL_CERT}}"
    SSLCertificateKeyFile "{{SSL_KEY}}"
    # Certbot's TLS settings, when its Apache plugin is installed (ignored otherwise).
    IncludeOptional /etc/letsencrypt/options-ssl-apache.conf

    <Directory "{{APP_DIR}}/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP runs in AutoDeploy's own PHP-FPM pool, as {{APP_USER}} (not in mod_php, not as www-data).
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:{{FPM_SOCKET}}|fcgi://localhost"
    </FilesMatch>
    # Some pages wait for the server for minutes (Quick setup, installing Supervisor, backup download).
    ProxyTimeout 900

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set X-Robots-Tag "noindex, nofollow"
        # The app sends these too; static files (public/build) get them from here.
        Header setifempty X-Content-Type-Options "nosniff"
        Header setifempty X-Frame-Options "SAMEORIGIN"
        Header setifempty Referrer-Policy "strict-origin-when-cross-origin"
        Header setifempty Permissions-Policy "camera=(), microphone=(), geolocation=()"
    </IfModule>

    # Who may open AutoDeploy (IP allowlist, extra password): commented examples in this file.
    IncludeOptional {{ACCESS_FILE}}

    # Never serve dot files (.env, .git, ...), even if one ends up in public/. After the include:
    # a <Location "/"> there must not open them again.
    <LocationMatch "/\.(?!well-known/)">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/{{SITE_NAME}}-error.log
    CustomLog ${APACHE_LOG_DIR}/{{SITE_NAME}}-access.log combined
</VirtualHost>
