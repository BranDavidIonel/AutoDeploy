; AutoDeploy – PHP-FPM pool, written by deploy/server/install.sh (running it again rewrites this file).
;
; AutoDeploy's PHP runs here as the user {{APP_USER}}, not as www-data and not in mod_php: the other
; sites cannot read its .env, database or SSH key, and AutoDeploy reaches the server only through
; SSH to root@127.0.0.1 (see docs/07-instalare-pe-server.md).

[{{POOL_NAME}}]
user = {{APP_USER}}
group = {{APP_USER}}

listen = {{FPM_SOCKET}}
listen.owner = {{WEB_SERVER_USER}}
listen.group = {{WEB_SERVER_USER}}
listen.mode = 0660

; One admin uses it: PHP processes start on demand and stop when idle (saves RAM).
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 60s
pm.max_requests = 500

; Some pages wait for the server for minutes (Quick setup, installing Supervisor, downloading a
; backup). Apache waits as long (ProxyTimeout 900 in the site).
php_admin_value[max_execution_time] = 900
php_admin_value[memory_limit] = 256M

; AUTODEPLOY_MAX_UPLOAD_MB in .env (build archives uploaded from the browser).
php_admin_value[upload_max_filesize] = {{UPLOAD_MB}}M
php_admin_value[post_max_size] = {{POST_MB}}M

php_admin_flag[log_errors] = on
php_admin_value[error_log] = {{APP_DIR}}/storage/logs/php-fpm.log
catch_workers_output = yes

; For the programs AutoDeploy starts (git, ssh, bash) and for "~" in key paths.
; {{APP_HOME}}/bin holds "php" -> the PHP of this install.
env[HOME] = {{APP_HOME}}
env[PATH] = {{APP_HOME}}/bin:/usr/local/bin:/usr/bin:/bin
env[LANG] = C.UTF-8

security.limit_extensions = .php
