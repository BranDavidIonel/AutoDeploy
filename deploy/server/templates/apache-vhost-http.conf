# AutoDeploy – Apache site for {{DOMAIN}}, written by deploy/server/install.sh.
# Running the installer again rewrites this file: put your own access rules in {{ACCESS_FILE}}
# (included below, never overwritten).

<VirtualHost *:80>
    ServerName {{DOMAIN}}

    # Let's Encrypt (certbot certonly --webroot -w {{ACME_ROOT}}); everything else goes to HTTPS.
    Alias /.well-known/acme-challenge/ "{{ACME_ROOT}}/.well-known/acme-challenge/"
    <Directory "{{ACME_ROOT}}/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://{{DOMAIN}}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/{{SITE_NAME}}-error.log
    CustomLog ${APACHE_LOG_DIR}/{{SITE_NAME}}-access.log combined
</VirtualHost>
